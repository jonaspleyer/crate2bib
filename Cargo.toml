[workspace]
resolver = "2"

members = [
    "x2bib",
    "x2bib-app",
    "crate2bib-cli",
]

[workspace.package]
version = "0.8.1"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
semver = { version = "1.0", features = [ "serde" ] }
pyo3 = { version = "0.29" }
reqwest = { version = "0.13" }
log = { version = "0.4"}

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
